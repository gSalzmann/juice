<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Juice — bateria dos seus periféricos sem fio">
  <title>Juice</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171d"/>
      <stop offset="1" stop-color="#232837"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="0.55" stop-color="#FF9A1F"/>
      <stop offset="1" stop-color="#F4600C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#FF9A1F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF9A1F" stop-opacity="0"/>
    </radialGradient>
    <!-- A wave two wavelengths wider than needed; sliding it by one wavelength loops seamlessly. -->
    <path id="wave" d="M-144 0 q18 -7 36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 V 240 H -144 Z"/>
    <clipPath id="cell"><rect x="70" y="90" width="134" height="82" rx="10"/></clipPath>
    <clipPath id="word">
      <text x="282" y="168" font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-size="128" font-weight="900" letter-spacing="-2">Juice</text>
    </clipPath>
  </defs>

  <rect width="900" height="260" rx="24" fill="url(#bg)"/>
  <rect width="900" height="260" rx="24" fill="url(#glow)"/>

  <!-- Battery that is also a juice box: straw on top, juice as the charge. -->
  <g>
    <path d="M150 84 L168 26 L206 18" fill="none" stroke="#E8EAED" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 84 L168 26 L206 18" fill="none" stroke="#FF5A5F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 9"/>
    <rect x="62" y="82" width="150" height="98" rx="18" fill="#101218" stroke="#E8EAED" stroke-width="8"/>
    <rect x="216" y="112" width="14" height="38" rx="5" fill="#E8EAED"/>
    <g clip-path="url(#cell)">
      <g>
        <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite"
          values="70 168; 70 96; 70 96; 70 168" keyTimes="0; 0.62; 0.86; 1" calcMode="spline"
          keySplines="0.45 0 0.3 1; 0 0 1 1; 0.6 0 0.4 1"/>
        <use href="#wave" fill="url(#juice)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 72 0" dur="1.6s" repeatCount="indefinite"/>
        </use>
        <use href="#wave" fill="#FFC93C" opacity="0.35" transform="translate(-30 -3)">
          <animateTransform attributeName="transform" type="translate" values="-30 -3; 42 -3" dur="2.3s" repeatCount="indefinite"/>
        </use>
      </g>
      <!-- bubbles -->
      <circle cx="100" r="3.5" fill="#FFF3D1" opacity="0">
        <animate attributeName="cy" values="172;100" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" r="2.5" fill="#FFF3D1" opacity="0">
        <animate attributeName="cy" values="172;110" dur="1.9s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="1.9s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="176" r="3" fill="#FFF3D1" opacity="0">
        <animate attributeName="cy" values="172;104" dur="2.8s" begin="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.75;0" dur="2.8s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- bolt flashes when the cell is full -->
    <path d="M142 98 L118 136 H136 L128 164 L156 122 H138 Z" fill="#FFFFFF" stroke="#B34700" stroke-width="3" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.64;0.84;0.9;1" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Wordmark: outline + the same juice filling the letters. -->
  <text x="282" y="168" font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-size="128" font-weight="900" letter-spacing="-2"
        fill="#2B3040" stroke="#3D4458" stroke-width="2">Juice</text>
  <g clip-path="url(#word)">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite"
        values="282 178; 282 62; 282 62; 282 178" keyTimes="0; 0.62; 0.86; 1" calcMode="spline"
        keySplines="0.45 0 0.3 1; 0 0 1 1; 0.6 0 0.4 1"/>
      <use href="#wave" fill="url(#juice)" transform="scale(1.4)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 72 0" dur="2s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
  </g>

  <text x="286" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#AEB4C2">
    <tspan font-style="italic" fill="#FFC93C">juice</tspan> (gíria em inglês) = carga da bateria  ·  <tspan font-style="italic">“running out of juice”</tspan>
  </text>
</svg>
